name: Build Kupchino APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Prepare app icon
        run: |
          mkdir -p app/src/main/res/drawable
          base64 -d app/src/main/icon.jpg.b64 > app/src/main/res/drawable/kupchino_icon.jpg
      - name: Build APK
        run: gradle assembleDebug
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Kupchino.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Kupchino-APK
          path: Kupchino.apk
