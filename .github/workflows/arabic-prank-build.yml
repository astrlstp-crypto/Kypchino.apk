name: Build ArabicPrankSafe APK

on:
  push:
    branches: [ "arabic-prank-app" ]
    paths:
      - ".build/arabic_prank_*.b64"
      - ".build/arabic_prank_trigger.txt"
      - ".build/overlay/**"
      - ".github/workflows/arabic-prank-build.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Restore project
        run: |
          rm -rf ArabicPrankSafe
          mkdir -p ArabicPrankSafe
          cat .build/arabic_prank_*.b64 | base64 --decode > /tmp/ArabicPrankSafe.zip
          unzip -q /tmp/ArabicPrankSafe.zip -d ArabicPrankSafe
          cp -f .build/overlay/MainActivity.java ArabicPrankSafe/app/src/main/java/com/example/arabicprank/MainActivity.java
          cp -f .build/overlay/no_command.jpg ArabicPrankSafe/app/src/main/res/drawable/no_command.jpg
      - name: Build debug APK
        working-directory: ArabicPrankSafe
        run: gradle :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: ArabicPrankSafe-debug-apk-v2
          path: ArabicPrankSafe/app/build/outputs/apk/debug/app-debug.apk
