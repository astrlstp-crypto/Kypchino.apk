name: Export Android APK signing tools

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/export-android-sign-tools.yml'

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Locate latest build-tools
        id: bt
        shell: bash
        run: |
          BT=$(ls -d "$ANDROID_SDK_ROOT"/build-tools/* | sort -V | tail -1)
          echo "path=$BT" >> "$GITHUB_OUTPUT"
          echo "Using $BT"
      - name: Prepare tools
        shell: bash
        run: |
          mkdir -p apk-tools/lib
          cp "${{ steps.bt.outputs.path }}/apksigner" apk-tools/
          cp "${{ steps.bt.outputs.path }}/lib/apksigner.jar" apk-tools/lib/
          cp "${{ steps.bt.outputs.path }}/zipalign" apk-tools/
          CXX=$(ldd "${{ steps.bt.outputs.path }}/zipalign" | awk '/libc\+\+\.so/{print $3; exit}')
          if [ -z "$CXX" ] || [ ! -f "$CXX" ]; then
            CXX=$(find "$ANDROID_SDK_ROOT" -name 'libc++.so*' -type f 2>/dev/null | head -1)
          fi
          if [ -z "$CXX" ] || [ ! -f "$CXX" ]; then
            echo 'libc++.so runtime not found' >&2
            exit 1
          fi
          cp "$CXX" apk-tools/libc++.so
          chmod +x apk-tools/apksigner apk-tools/zipalign
          LD_LIBRARY_PATH="$PWD/apk-tools" ./apk-tools/zipalign -h >/dev/null || true
          ./apk-tools/apksigner --version
          echo "Copied libc++ from $CXX"
      - name: Upload tools
        uses: actions/upload-artifact@v4
        with:
          name: android-apk-tools
          path: apk-tools
