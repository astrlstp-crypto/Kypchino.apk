name: Build LamboCheats Alpha APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'lambocheat/**'
      - '.github/workflows/lambocheat.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply Alpha patch
        working-directory: lambocheat
        run: python3 patch_alpha.py

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Alpha APK
        working-directory: lambocheat
        run: gradle --no-daemon assembleDebug

      - name: Prepare Alpha APK
        run: cp lambocheat/app/build/outputs/apk/debug/app-debug.apk lambocheat/LamboCheats_Alpha.apk

      - name: Upload Alpha APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: LamboCheats_Alpha
          path: lambocheat/LamboCheats_Alpha.apk

      - name: Publish LamboCheats Alpha release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: lambocheats-alpha
          name: LamboCheats [Alpha]
          body: |
            LamboCheats [Alpha] for SchoolBoy Runaway [Alpha].
            Port 48772 / PONGALPHA.
            Exact item-code lookup through SpawnItems.items.
            Fly targets both exact FP_Mode implementations.
            Noclip ignores wall/ceiling/door/window colliders while keeping floor/ground solid.
            NPC XYZ uses exact AI.Mom / AI.Dad / AI.Dog / AI.Andrew + AI.Igor components.
            Detailed ERR:* diagnostics are shown instead of silent button failures.
            Package: com.lambocheats.alpha
          files: lambocheat/LamboCheats_Alpha.apk
          overwrite_files: true
          make_latest: true
          target_commitish: main
