name: Build LamboCheats B1 APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'lambocheat/**'
      - '.github/workflows/lambocheat.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build B1 APK
        working-directory: lambocheat
        run: gradle --no-daemon assembleDebug

      - name: Prepare B1 APK
        run: cp lambocheat/app/build/outputs/apk/debug/app-debug.apk lambocheat/LamboCheatsB1.apk

      - name: Publish LamboCheats B1 release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: lambocheats-b1
          name: LamboCheats B1
          body: |
            LamboCheats B1 for SchoolBoy runaway B1.
            Tabs: ITEMS / MODES / NPC / TRANSPORT.
            TCP main-thread bridge on port 48771.
            Floating LC automatically disappears after the B1 game exits.
            Package: com.lambocheats.b1
            Version: B1
          files: lambocheat/LamboCheatsB1.apk
          overwrite_files: true
          make_latest: true
          target_commitish: main
