name: Build LamboCheat V7 APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'lambocheat/**'
      - '.github/workflows/lambocheat.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        working-directory: lambocheat
        run: gradle --no-daemon assembleDebug

      - name: Prepare V7 APK
        run: cp lambocheat/app/build/outputs/apk/debug/app-debug.apk lambocheat/LamboCheatV7.apk

      - name: Publish LamboCheat V7 release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: lambocheat-v7
          name: LamboCheat V7
          body: |
            LamboCheat V7 for SchoolBoy LamboV7.
            Safe UDP bridge on port 48769.
            Package: com.lambocheat.app.v7
            Version: 0.7
          files: lambocheat/LamboCheatV7.apk
          overwrite_files: true
          make_latest: true
          target_commitish: main
