name: Build LamboCheat V8 APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'lambocheat/**'
      - '.github/workflows/lambocheat.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        working-directory: lambocheat
        run: gradle --no-daemon assembleDebug

      - name: Prepare V8 APK
        run: cp lambocheat/app/build/outputs/apk/debug/app-debug.apk lambocheat/LamboCheatV8.apk

      - name: Publish LamboCheat V8 release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: lambocheat-v8
          name: LamboCheat V8
          body: |
            LamboCheat V8 for SchoolBoy LamboV8.
            Main-thread TCP bridge on port 48770.
            Package: com.lambocheat.app.v8
            Version: 0.8
          files: lambocheat/LamboCheatV8.apk
          overwrite_files: true
          make_latest: true
          target_commitish: main
