name: Build LamboCheats B1.2 APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'lambocheat/**'
      - '.github/workflows/lambocheat.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply B1.2 UI and item mapping patch
        working-directory: lambocheat
        run: python3 patch_b11.py

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build B1.2 APK
        working-directory: lambocheat
        run: gradle --no-daemon assembleDebug

      - name: Prepare B1.2 APK
        run: cp lambocheat/app/build/outputs/apk/debug/app-debug.apk lambocheat/LamboCheatsB1_2.apk

      - name: Upload B1.2 APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: LamboCheatsB1_2
          path: lambocheat/LamboCheatsB1_2.apk

      - name: Publish LamboCheats B1.2 release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: lambocheats-b12
          name: LamboCheats B1.2
          body: |
            LamboCheats B1.2 for SchoolBoy runaway B1.2.
            Selective Noclip UI: walls/ceilings passable while floor/ground stay solid.
            Fly and NPC XYZ scale controls target the B1.2 game bridge.
            Tabs: ITEMS / MODES / NPC / TRANSPORT.
            TCP bridge port: 48771.
            Package: com.lambocheats.b12
            Version: B1.2
          files: lambocheat/LamboCheatsB1_2.apk
          overwrite_files: true
          make_latest: true
          target_commitish: main
