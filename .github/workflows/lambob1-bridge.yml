name: Build Lambo B1.1 native bridge

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'lambobridge/native/lambob1.c'
      - 'lambobridge/apply_b11.py'
      - '.github/workflows/lambob1-bridge.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate B1.1 bridge source
        shell: bash
        run: python3 lambobridge/apply_b11.py

      - name: Find Android NDK
        id: ndk
        shell: bash
        run: |
          NDK=$(ls -d "$ANDROID_SDK_ROOT"/ndk/* | sort -V | tail -1)
          echo "path=$NDK" >> "$GITHUB_OUTPUT"
          echo "Using $NDK"

      - name: Build arm64 bridge
        shell: bash
        run: |
          CC="${{ steps.ndk.outputs.path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang"
          "$CC" -shared -fPIC -O2 -Wall -Wextra \
            -Wl,-soname,liblambocheat_game.so \
            -o liblambocheat_game.so lambobridge/native/lambob1.c -ldl
          file liblambocheat_game.so
          readelf -Ws liblambocheat_game.so | grep lambocheat_init

      - name: Upload bridge artifact
        uses: actions/upload-artifact@v4
        with:
          name: lambob1-bridge
          path: liblambocheat_game.so

      - name: Publish B1 bridge release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: lambobridge-b1
          name: Lambo B1.1 native bridge
          body: |
            Native bridge B1.1 for SchoolBoy runaway B1.1.
            Correct runtime item matching, stronger Fly/Noclip, fixed safe/basement actions,
            and safer transport spawning. TCP loopback port 48771.
          files: liblambocheat_game.so
          overwrite_files: true
          make_latest: false
          target_commitish: main
