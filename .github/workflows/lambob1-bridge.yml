name: Build Lambo Alpha native bridge

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'lambobridge/apply_b12.py'
      - '.github/workflows/lambob1-bridge.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate Alpha bridge source
        run: python3 lambobridge/apply_b12.py

      - name: Find Android NDK
        id: ndk
        shell: bash
        run: |
          NDK=$(ls -d "$ANDROID_SDK_ROOT"/ndk/* | sort -V | tail -1)
          echo "path=$NDK" >> "$GITHUB_OUTPUT"

      - name: Build arm64 Alpha bridge
        shell: bash
        run: |
          CC="${{ steps.ndk.outputs.path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang"
          "$CC" -shared -fPIC -O2 -Wall -Wextra \
            -Wl,-soname,liblambocheat_game.so \
            -o liblambocheat_game.so lambobridge/native/lambob12.c -ldl
          file liblambocheat_game.so
          readelf -d liblambocheat_game.so | grep NEEDED
          readelf -Ws liblambocheat_game.so | grep lambocheat_init

      - name: Upload Alpha bridge artifact
        uses: actions/upload-artifact@v4
        with:
          name: lambo-alpha-bridge
          path: liblambocheat_game.so

      - name: Publish Alpha bridge release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: lambobridge-alpha
          name: Lambo Alpha native bridge
          body: |
            Alpha bridge for SchoolBoy Runaway [Alpha].
            Exact FP_Mode namespaces, selective wall/ceiling noclip,
            exact SpawnItems.items lookup, exact AI component scaling,
            corrected safe/front-door calls and explicit error responses.
            TCP loopback port 48772.
          files: liblambocheat_game.so
          overwrite_files: true
          make_latest: false
          target_commitish: main
