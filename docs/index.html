<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111111"><link rel="manifest" href="manifest.webmanifest"><title>Купчино Arcade</title><style>body{margin:0;background:#111;color:#fff;font-family:system-ui;text-align:center}button{font-size:18px;padding:12px;margin:6px;border-radius:14px;border:0}canvas{background:#222;max-width:96vw;touch-action:none}.hide{display:none}#menu{padding:30px}#controls{display:flex;justify-content:center;flex-wrap:wrap}</style></head><body><div id="menu"><h1>КУПЧИНО ARCADE ❤️</h1><button onclick="show('mine')">💣 Сапёрное Купчино</button><button onclick="show('flap')">🐦 Флаппи Купчино</button><button onclick="show('tet')">🧱 Тетрипчино</button><p>Работает офлайн после первого запуска</p></div><div id="game" class="hide"><button onclick="home()">← Игры</button><h2 id="title"></h2><canvas id="c" width="360" height="640"></canvas><div id="controls"></div></div><script>
let mode='',cv=document.getElementById('c'),x=cv.getContext('2d'),timer;
function home(){clearInterval(timer);game.classList.add('hide');menu.classList.remove('hide');controls.innerHTML='';}
function show(m){mode=m;menu.classList.add('hide');game.classList.remove('hide');if(m==='mine')mine();if(m==='flap')flap();if(m==='tet')tet();}
function mine(){title.textContent='Сапёрное Купчино';let R=9,C=9,M=10,a=[...Array(R)].map(()=>Array(C).fill(0)),o=[...Array(R)].map(()=>Array(C).fill(0)),f=[...Array(R)].map(()=>Array(C).fill(0));for(let n=0;n<M;){let r=Math.random()*R|0,c=Math.random()*C|0;if(a[r][c]!=9){a[r][c]=9;n++}}for(let r=0;r<R;r++)for(let c=0;c<C;c++)if(a[r][c]!=9)for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++){let rr=r+dr,cc=c+dc;if(rr>=0&&rr<R&&cc>=0&&cc<C&&a[rr][cc]==9)a[r][c]++}let dead=false;function draw(){x.clearRect(0,0,360,640);let s=36,ox=18,oy=120;x.font='22px sans-serif';x.textAlign='center';for(let r=0;r<R;r++)for(let c=0;c<C;c++){x.fillStyle=o[r][c]?(a[r][c]==9?'#d44':'#ddd'):'#666';x.fillRect(ox+c*s+1,oy+r*s+1,s-2,s-2);if(f[r][c]&&!o[r][c]){x.fillStyle='#ff0';x.fillText('⚑',ox+c*s+s/2,oy+r*s+25)}if(o[r][c]&&a[r][c]>0){x.fillStyle='#111';x.fillText(a[r][c]==9?'●':a[r][c],ox+c*s+s/2,oy+r*s+25)}}}function rev(r,c){if(r<0||r>=R||c<0||c>=C||o[r][c]||f[r][c])return;o[r][c]=1;if(a[r][c]==9){dead=true;return}if(a[r][c]==0)for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++)rev(r+dr,c+dc)}let hold;cv.onpointerdown=e=>{hold=setTimeout(()=>{let b=cv.getBoundingClientRect(),c=((e.clientX-b.left)*360/b.width-18)/36|0,r=((e.clientY-b.top)*640/b.height-120)/36|0;if(r>=0&&r<R&&c>=0&&c<C&&!o[r][c])f[r][c]=!f[r][c];draw()},500)};cv.onpointerup=e=>{clearTimeout(hold);if(dead){mine();return}let b=cv.getBoundingClientRect(),c=((e.clientX-b.left)*360/b.width-18)/36|0,r=((e.clientY-b.top)*640/b.height-120)/36|0;if(r>=0&&r<R&&c>=0&&c<C){rev(r,c);draw()}};draw();}
function flap(){title.textContent='Флаппи Купчино';let y=300,v=0,score=0,pipes=[],bird='#ffd728',beak='#ff7814',hat=0,paused=false;controls.innerHTML='<button id="pause">⏸</button><button id="bird">🐦🎨</button><button id="bk">🟠🎨</button><button id="hat">🧢</button>';function draw(){x.fillStyle='#79cdf5';x.fillRect(0,0,360,640);for(let p of pipes){x.fillStyle=p.col;x.fillRect(p.x,0,55,p.g-90);x.fillRect(p.x,p.g+90,55,640)}x.fillStyle=bird;x.beginPath();x.ellipse(90,y,22,17,0,0,7);x.fill();x.fillStyle=beak;x.beginPath();x.moveTo(108,y);x.lineTo(130,y+8);x.lineTo(108,y+13);x.fill();x.fillStyle='#fff';x.fillText(score,180,45);if(paused){x.fillStyle='rgba(90,90,90,.32)';x.fillRect(35,180,290,280);x.fillStyle='#fff';x.font='28px sans-serif';x.fillText('ПАУЗА',180,230);x.font='16px sans-serif';x.fillText('Птичку меняй кнопками снизу',180,270)}}function step(){if(paused)return;v+=.55;y+=v;if(Math.random()<.018)pipes.push({x:370,g:150+Math.random()*300,col:['#f45','#fa4','#fd4','#4d8','#4af','#85f','#e5d'][Math.random()*7|0]});for(let p of pipes)p.x-=3;pipes=pipes.filter(p=>p.x>-70);for(let p of pipes)if(p.x<90&&p.x+55>70&&(y<p.g-90||y>p.g+90)){y=300;v=0;score=0;pipes=[]}if(y<0||y>640){y=300;v=0;score=0;pipes=[]}draw()}cv.onpointerdown=()=>{if(!paused)v=-8};pause.onclick=()=>{paused=!paused;draw()};bird.onclick=()=>{bird=['#ffd728','#ff5d73','#4fd1ff','#7ee787','#c77dff','#fff'][Math.random()*6|0];draw()};bk.onclick=()=>{beak=['#ff7814','#ffff4a','#ff4d4d','#73e6ff','#fff'][Math.random()*5|0];draw()};hat.onclick=()=>{hat=(hat+1)%4};timer=setInterval(step,16);}
function tet(){title.textContent='Тетрипчино';let W=10,H=20,b=[...Array(H)].map(()=>Array(W).fill(0)),py=0,px=3,shape=[[1,1,1],[0,1,0]],score=0;controls.innerHTML='<button id="L">◀</button><button id="R">▶</button><button id="D">▼</button><button id="ROT">⟳</button><button id="DROP">⤓</button>';function hit(nx,ny,s=shape){return s.some((r,yy)=>r.some((v,xx)=>v&&(nx+xx<0||nx+xx>=W||ny+yy>=H||(ny+yy>=0&&b[ny+yy][nx+xx]))))}function lock(){shape.forEach((r,yy)=>r.forEach((v,xx)=>{if(v)b[py+yy][px+xx]=1}));for(let r=H-1;r>=0;r--)if(b[r].every(Boolean)){b.splice(r,1);b.unshift(Array(W).fill(0));score+=100;r++}py=0;px=3;if(hit(px,py)){b=[...Array(H)].map(()=>Array(W).fill(0));score=0}}function draw(){x.fillStyle='#111';x.fillRect(0,0,360,640);let s=25,ox=55,oy=80;x.fillStyle='#4af';for(let r=0;r<H;r++)for(let c=0;c<W;c++)if(b[r][c])x.fillRect(ox+c*s,oy+r*s,s-1,s-1);x.fillStyle='#fd4';shape.forEach((r,yy)=>r.forEach((v,xx)=>{if(v)x.fillRect(ox+(px+xx)*s,oy+(py+yy)*s,s-1,s-1)}));x.fillStyle='#fff';x.fillText('Счёт '+score,180,45)}function down(){if(!hit(px,py+1))py++;else lock();draw()}L.onclick=()=>{if(!hit(px-1,py))px--;draw()};R.onclick=()=>{if(!hit(px+1,py))px++;draw()};D.onclick=down;ROT.onclick=()=>{let n=shape[0].map((_,i)=>shape.map(r=>r[i]).reverse());if(!hit(px,py,n))shape=n;draw()};DROP.onclick=()=>{while(!hit(px,py+1))py++;lock();draw()};timer=setInterval(down,500);draw();}
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');
</script></body></html>
