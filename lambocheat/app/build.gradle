plugins {
    id 'com.android.application'
}

android {
    namespace 'com.lambocheat.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.lambocheat.app.v5'
        minSdk 26
        targetSdk 28
        versionCode 5
        versionName '0.5'
    }

    buildTypes {
        debug {
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
