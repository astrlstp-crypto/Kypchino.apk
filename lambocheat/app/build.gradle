plugins {
    id 'com.android.application'
}

android {
    namespace 'com.lambocheat.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.lambocheats.b1'
        minSdk 26
        targetSdk 28
        versionCode 101
        versionName 'B1'
    }

    buildTypes {
        debug {
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
